[package]
name = "poseidon-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# Provider-agnostic AI tag suggester. Mirrors poseidon-providers: a trait with
# pluggable backends (a local OpenAI-compatible endpoint first - Ollama/LM Studio/
# vLLM - so a work item's title never has to leave the box; hosted Claude/Gemini
# can follow). Given a work item and the team's ALLOWED tags, it proposes a subset
# of those tags; output is validated against the allowed set (hallucinated tags are
# dropped), and nothing is ever auto-applied - it feeds the same advisory
# `TagSuggestion` chips the keyword suggester already populates.
[dependencies]
poseidon-core = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Offline (in-process) inference of a small quantized GGUF model - no Ollama.
# candle is pure Rust (no C++ toolchain), so it keeps the single-binary story and
# cross-compiles to desktop + Android.
candle-core = "0.8"
candle-transformers = "0.8"
tokenizers = "0.23"
hf-hub = "0.3"

[features]
# Off by default: the plain build is pure-CPU and runs anywhere (the single-binary,
# zero-dependency story). Build with `--features cuda` on a machine with the CUDA
# toolkit to compile GPU kernels and run the embedded model on an NVIDIA GPU
# (~100x faster). This produces a CUDA-linked binary that needs an NVIDIA GPU +
# runtime to load, so it ships as a SEPARATE artifact, not the default.
cuda = ["candle-core/cuda", "candle-transformers/cuda"]

[dev-dependencies]
