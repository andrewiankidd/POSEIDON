[package]
publish = false
name = "poseiden-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "POSEIDEN CLI - poll / lint / report over the same Service the GUI uses. `poseiden lint` exits non-zero on error-severity flags so CI can gate pipelines on backlog hygiene."

[[bin]]
name = "poseiden"
path = "src/main.rs"

[dependencies]
poseiden-core = { workspace = true }
poseiden-paths = { workspace = true }
poseiden-server = { workspace = true }
poseiden-store = { workspace = true }
poseiden-telemetry = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }

[features]
# GPU tagging from the CLI: forwards to poseiden-server -> poseiden-ai's candle
# CUDA build. Off by default (CPU build runs anywhere); build a GPU tagging
# binary with `cargo build -p poseiden-cli --features cuda` on a CUDA host, then
# `poseiden tag` runs the embedded model on the NVIDIA GPU. This is the headless
# GPU path (the WebGPU one is browser-only and can't reach the CLI).
cuda = ["poseiden-server/cuda"]
