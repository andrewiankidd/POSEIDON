[package]
publish = false
name = "poseiden-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "POSEIDEN domain types - provider-agnostic normalised shapes (work items, pipelines, flags, reports) + config schema. IO-free, the shared wire schema across HTTP, Tauri IPC, and the CLI."

[dependencies]
serde = { workspace = true }
chrono = { workspace = true }
# Telemetry settings live in the config schema. Core only touches the IO-free
# `TelemetrySettings` types; the OTEL machinery is pulled in by the binaries, so
# core stays light in a core-only build.
poseiden-telemetry = { workspace = true }

[dev-dependencies]
# Config is JSON in the DB (per-owner `UserConfig` blob) - tests parse that shape.
serde_json = { workspace = true }
