[package]
publish = false
name = "poseidon-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "POSEIDON server - the shared Service (business logic over Store + Providers), the tokio poll scheduler, and the axum HTTP API. Runs as the Docker web instance; embedded as a library inside the Tauri shell."

[lib]
name = "poseidon_server"
path = "src/lib.rs"

[[bin]]
name = "poseidon-server"
path = "src/main.rs"

[dependencies]
poseidon-core = { workspace = true }
poseidon-telemetry = { workspace = true }
poseidon-paths = { workspace = true }
poseidon-rules = { workspace = true }
poseidon-reports = { workspace = true }
poseidon-ai = { workspace = true }
poseidon-providers = { workspace = true }
poseidon-store = { workspace = true }
poseidon-doctor = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
jsonwebtoken = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

[features]
# Forward the embedded-model GPU build to poseidon-ai (off by default; CPU build
# runs anywhere). Build a GPU desktop binary with `--features cuda`.
cuda = ["poseidon-ai/cuda"]
