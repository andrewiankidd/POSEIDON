{{- if .Values.networkPolicy.enabled }}
# Restrict who can reach the app pod. The app trusts X-Auth-Request-Email as the
# caller's identity; the ingress overwrites that header from oauth2-proxy so it
# can't be forged THROUGH the ingress, but without this policy any in-cluster pod
# could hit the Service directly and set the header itself (tenant impersonation).
# This allows ingress ONLY from networkPolicy.allowFrom (your controller/gateway).
#
# Requires a CNI that enforces NetworkPolicy (Calico, Cilium, ...). Note: some
# CNIs subject kubelet liveness/readiness probes to policy too - if probes start
# failing, add the node source (e.g. an ipBlock for the node CIDR) to allowFrom.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "poseiden.fullname" . }}
  labels:
    {{- include "poseiden.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "poseiden.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- with .Values.networkPolicy.allowFrom }}
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.service.targetPort }}
  {{- end }}
{{- end }}
