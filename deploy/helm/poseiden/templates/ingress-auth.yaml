{{- if and .Values.ingress.enabled (eq .Values.ingress.type "nginx") (include "poseiden.deployProxy" .) }}
# Auth Ingress: oauth2-proxy's /oauth2/* endpoints, and any bundled IdP path,
# on the SAME host but WITHOUT the app Ingress's auth-* annotations - so these
# paths aren't themselves auth-challenged (which would redirect-loop the login).
# nginx-ingress merges the two Ingresses per host; annotations are per-Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "poseiden.fullname" . }}-auth
  labels:
    {{- include "poseiden.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: {{ include "poseiden.oauth2proxy.fullname" . }}
                port:
                  number: 80
          {{- if and (eq .Values.auth.provider "dex") .Values.auth.dex.bundled.enabled }}
          # Bundled Dex, exposed so the browser can reach its login page.
          - path: /dex
            pathType: Prefix
            backend:
              service:
                name: {{ include "poseiden.dex.fullname" . }}
                port:
                  number: 5556
          {{- end }}
          {{- if and (eq .Values.auth.provider "keycloak") .Values.auth.keycloak.bundled.enabled }}
          # Bundled Keycloak served under /auth (KC_HTTP_RELATIVE_PATH).
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "poseiden.keycloak.fullname" . }}
                port:
                  number: 8080
          {{- end }}
{{- end }}
