# Enterprise cluster (Istio mesh) + Azure AD auth. The chart deploys oauth2-proxy;
# a cluster admin registers it once in istiod meshConfig.extensionProviders
# (see the chart README). Credentials + PAT come from existing Secrets managed by
# the deployment repo.
ingress:
  type: istio
  host: poseiden.example.com
  istio:
    gateway: istio-system/istio-ingressgateway
    # externalProviderName left blank -> chart deploys oauth2-proxy.
    rootNamespace: istio-system
    gatewaySelector:
      istio: ingressgateway

azureDevOps:
  existingSecret: poseiden-ado-pat

auth:
  enabled: true
  provider: azure
  azure:
    tenant: "00000000-0000-0000-0000-000000000000"
    emailDomains: ["mycompany.com"]
    existingSecret: poseiden-oauth
    existingSecretKeys:
      clientId: client-id
      clientSecret: client-secret
