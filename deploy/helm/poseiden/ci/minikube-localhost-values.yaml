# Local minikube DEV PLAYGROUND: the server + a web client pointed at it + a
# landing page, all single-tenant (auth OFF, so the cross-origin client works).
# See values.yaml `localhost` and templates/localhost.yaml.
#
#   POSEIDEN_VALUES=deploy/helm/poseiden/ci/minikube-localhost-values.yaml ./poseiden.sh up
#
# Map all three hosts to the ingress IP (minikube ip):
#   poseiden.localhost  client-poseiden.localhost  hub-poseiden.localhost
ingress:
  type: nginx
  className: nginx
  host: poseiden.localhost

# Auth off: the client reaches the server cross-origin and a browser won't send an
# auth cookie cross-site, so the playground is the single `default` tenant.
auth:
  enabled: false

localhost:
  enabled: true

# Bundle a local model so the AI tag suggester works out of the box: `up` deploys
# Ollama, auto-pulls the model, and wires the app to it. Needs a few GB of RAM in
# the minikube VM (minikube start --memory 6g). Titles never leave the cluster.
ai:
  enabled: true
  model: "llama3.2:1b"
  bundled:
    enabled: true

azureDevOps:
  pat: ""
