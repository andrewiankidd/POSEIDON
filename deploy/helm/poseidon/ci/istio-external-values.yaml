# Thinnest enterprise deployment: Istio mesh with a PRE-REGISTERED shared
# ext-authz provider. The chart creates only the VirtualService +
# AuthorizationPolicy - no oauth2-proxy, no IdP. Credentials are irrelevant to the
# chart here (the shared oauth2-proxy owns them).
ingress:
  type: istio
  host: poseidon.example.com
  istio:
    gateway: istio-system/istio-ingressgateway
    externalProviderName: shared-oauth2-proxy   # already in meshConfig
    rootNamespace: istio-system
    gatewaySelector:
      istio: ingressgateway

azureDevOps:
  existingSecret: poseidon-ado-pat

auth:
  enabled: true
  provider: azure          # only used to shape the AuthorizationPolicy scope
  azure:
    existingSecret: unused
