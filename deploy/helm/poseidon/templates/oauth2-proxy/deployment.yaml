{{- if include "poseidon.deployProxy" . }}
{{- $cfg := index .Values.auth .Values.auth.provider }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "poseidon.oauth2proxy.fullname" . }}
  labels:
    {{- include "poseidon.oauth2proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.auth.oauth2Proxy.replicas }}
  selector:
    matchLabels:
      {{- include "poseidon.oauth2proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "poseidon.oauth2proxy.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: oauth2-proxy
          image: {{ .Values.auth.oauth2Proxy.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --pass-access-token=true
            - --pass-authorization-header=true
            - --skip-provider-button=true
            - --cookie-secure={{ .Values.auth.cookieSecure }}
            # Lax (not Strict) so the session cookie survives the IdP -> app
            # top-level redirect on the way back from login.
            - --cookie-samesite=lax
            # Per-request CSRF cookie. Loading the app fans out several gated
            # requests at once; with a single shared CSRF cookie each one's
            # /oauth2/start clobbers the previous, so by the time the login form
            # POSTs, its token no longer matches -> "invalid CSRF token" 403. One
            # cookie per flow (keyed by state) stops concurrent auth requests from
            # stomping on each other.
            - --cookie-csrf-per-request=true
            - --redirect-url={{ include "poseidon.baseUrl" . }}/oauth2/callback
            # Auth-url subrequest / ext-authz pattern: oauth2-proxy authenticates
            # but does not proxy app traffic, so the upstream is a static 200.
            - --upstream=static://200
            {{- if eq .Values.auth.provider "google" }}
            - --provider=google
            {{- range $cfg.allowedDomains }}
            - --email-domain={{ . }}
            {{- else }}
            - --email-domain=*
            {{- end }}
            {{- else if eq .Values.auth.provider "github" }}
            - --provider=github
            - --email-domain=*
            {{- range $cfg.orgs }}
            - --github-org={{ . }}
            {{- end }}
            {{- range $cfg.teams }}
            - --github-team={{ . }}
            {{- end }}
            {{- else if eq .Values.auth.provider "azure" }}
            - --provider=oidc
            - --oidc-issuer-url=https://login.microsoftonline.com/{{ $cfg.tenant }}/v2.0
            {{- range $cfg.emailDomains }}
            - --email-domain={{ . }}
            {{- end }}
            {{- else if eq .Values.auth.provider "auth0" }}
            - --provider=oidc
            - --oidc-issuer-url=https://{{ $cfg.domain }}/
            - --email-domain=*
            {{- else if eq .Values.auth.provider "keycloak" }}
            - --provider=keycloak-oidc
            - --email-domain=*
            {{- if $cfg.bundled.enabled }}
            {{- $kc := include "poseidon.keycloak.fullname" . }}
            {{- $realmPath := printf "auth/realms/%s" $cfg.realm }}
            # Split-horizon: the browser is redirected to the EXTERNAL issuer, but
            # server-side token/jwks calls hit the in-cluster Keycloak directly, so
            # no in-cluster resolution of the external host is needed.
            - --oidc-issuer-url={{ include "poseidon.baseUrl" . }}/{{ $realmPath }}
            - --skip-oidc-discovery=true
            - --login-url={{ include "poseidon.baseUrl" . }}/{{ $realmPath }}/protocol/openid-connect/auth
            - --redeem-url=http://{{ $kc }}:8080/{{ $realmPath }}/protocol/openid-connect/token
            - --oidc-jwks-url=http://{{ $kc }}:8080/{{ $realmPath }}/protocol/openid-connect/certs
            {{- else }}
            - --oidc-issuer-url={{ $cfg.url }}/realms/{{ $cfg.realm }}
            {{- end }}
            {{- else if eq .Values.auth.provider "dex" }}
            - --provider=oidc
            - --email-domain=*
            - --insecure-oidc-allow-unverified-email=true
            {{- if $cfg.bundled.enabled }}
            {{- $dex := include "poseidon.dex.fullname" . }}
            # Split-horizon (see the Keycloak note): external login, in-cluster token/jwks.
            - --oidc-issuer-url={{ include "poseidon.baseUrl" . }}/dex
            - --skip-oidc-discovery=true
            - --login-url={{ include "poseidon.baseUrl" . }}/dex/auth
            - --redeem-url=http://{{ $dex }}:5556/dex/token
            - --oidc-jwks-url=http://{{ $dex }}:5556/dex/keys
            {{- end }}
            {{- end }}
            {{- with .Values.auth.oauth2Proxy.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "poseidon.oauthSecretName" . }}
                  key: {{ include "poseidon.oauthSecretClientIdKey" . }}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "poseidon.oauthSecretName" . }}
                  key: {{ include "poseidon.oauthSecretClientSecretKey" . }}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "poseidon.cookieSecretName" . }}
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          livenessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.auth.oauth2Proxy.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
{{- end }}
