{{- if and (include "poseidon.deployProxy" .) (not .Values.auth.cookieExistingSecret) }}
{{- $name := include "poseidon.cookieSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $b64 := "" }}
{{- if .Values.auth.cookieSecret }}
{{- $b64 = .Values.auth.cookieSecret | b64enc }}
{{- else if and $existing $existing.data (index $existing.data "cookie-secret") }}
# Reuse the previously-generated secret so upgrades don't rotate it (which would
# invalidate every active session).
{{- $b64 = index $existing.data "cookie-secret" }}
{{- else }}
{{- $b64 = randAlphaNum 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "poseidon.oauth2proxy.labels" . | nindent 4 }}
type: Opaque
data:
  cookie-secret: {{ $b64 }}
{{- end }}
