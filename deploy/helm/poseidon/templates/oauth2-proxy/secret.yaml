{{- if include "poseidon.deployProxy" . }}
{{- $provider := .Values.auth.provider }}
{{- $cfg := index .Values.auth $provider }}
{{- if not $cfg.existingSecret }}
{{- $name := include "poseidon.oauth2proxy.fullname" . }}
{{- $clientId := "" }}
{{- $clientSecret := "" }}
{{- if eq $provider "dex" }}
  {{- /* Bundled Dex: the chart owns a static client. Dex reads the SAME secret
         at runtime (secretEnv), so both sides stay in sync. */}}
  {{- $clientId = $name }}
  {{- $clientSecret = include "poseidon.bundledClientSecret" . }}
{{- else if and (eq $provider "keycloak") $cfg.bundled.enabled }}
  {{- $clientId = $cfg.clientId }}
  {{- $clientSecret = include "poseidon.bundledClientSecret" . }}
{{- else }}
  {{- /* External IdP (google/github/azure/auth0/external keycloak): inline creds. */}}
  {{- $clientId = $cfg.clientId }}
  {{- $clientSecret = $cfg.clientSecret }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "poseidon.oauth2proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-id: {{ $clientId | quote }}
  client-secret: {{ $clientSecret | quote }}
{{- end }}
{{- end }}
