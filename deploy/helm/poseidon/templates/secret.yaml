{{- if and .Values.azureDevOps.pat (not .Values.azureDevOps.existingSecret) }}
# Chart-managed Secret holding the Azure DevOps PAT. For anything beyond a PoC,
# set azureDevOps.existingSecret and manage the token out-of-band instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poseidon.patSecretName" . }}
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
type: Opaque
stringData:
  pat: {{ .Values.azureDevOps.pat | quote }}
{{- end }}
