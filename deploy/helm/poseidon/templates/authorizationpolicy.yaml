{{- if and (eq .Values.ingress.type "istio") .Values.auth.enabled }}
# CUSTOM action delegates the auth decision to an ext-authz provider registered
# in istiod meshConfig.extensionProviders. `provider.name` must match that
# registration (see the chart README for the one-time cluster-admin step). Lives
# in the gateway's namespace so it intercepts at the shared ingress.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "poseidon.fullname" . }}-oauth
  namespace: {{ .Values.ingress.istio.rootNamespace }}
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- toYaml .Values.ingress.istio.gatewaySelector | nindent 6 }}
  action: CUSTOM
  provider:
    name: {{ .Values.ingress.istio.externalProviderName | default (include "poseidon.oauth2proxy.fullname" .) }}
  rules:
    - to:
        - operation:
            hosts:
              - {{ .Values.ingress.host | quote }}
{{- end }}
