{{- if and (eq .Values.auth.provider "dex") .Values.auth.dex.bundled.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "poseidon.dex.fullname" . }}
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
    app.kubernetes.io/component: dex
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "poseidon.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dex
  template:
    metadata:
      labels:
        {{- include "poseidon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dex
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/dex/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: dex
          image: {{ .Values.auth.dex.bundled.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          env:
            # Keeps the static-client secret identical to what oauth2-proxy uses.
            - name: DEX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "poseidon.oauth2proxy.fullname" . }}
                  key: client-secret
          ports:
            - name: http
              containerPort: 5556
          readinessProbe:
            httpGet: { path: /dex/healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.auth.dex.bundled.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "poseidon.dex.fullname" . }}
{{- end }}
