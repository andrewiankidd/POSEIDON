{{- if and (eq .Values.auth.provider "keycloak") .Values.auth.keycloak.bundled.enabled }}
# Realm import for the bundled (POC) Keycloak: one realm + the oauth2-proxy
# client, whose secret matches what oauth2-proxy uses. Delivered as a Secret (not
# a ConfigMap) so the client secret isn't stored in plaintext config.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poseidon.keycloak.fullname" . }}-realm
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
type: Opaque
stringData:
  poseidon-realm.json: |
    {
      "realm": {{ .Values.auth.keycloak.realm | quote }},
      "enabled": true,
      "clients": [
        {
          "clientId": {{ .Values.auth.keycloak.clientId | quote }},
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": {{ include "poseidon.bundledClientSecret" . | quote }},
          "redirectUris": [{{ printf "%s/oauth2/callback" (include "poseidon.baseUrl" .) | quote }}],
          "webOrigins": [{{ include "poseidon.baseUrl" . | quote }}],
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false
        }
      ]
    }
{{- end }}
