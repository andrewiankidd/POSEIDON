{{- if and .Values.ingress.enabled (eq .Values.ingress.type "nginx") }}
# App Ingress: the `/` path, auth-challenged by oauth2-proxy when auth is on.
# The oauth2-proxy + bundled-IdP paths live on a SEPARATE Ingress
# (ingress-auth.yaml) with NO auth annotations - otherwise nginx would challenge
# oauth2-proxy's own /oauth2/* endpoints and the login would redirect-loop.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "poseidon.fullname" . }}
  labels:
    {{- include "poseidon.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.auth.enabled }}
    # nginx challenges every request via a sub-request to oauth2-proxy before
    # forwarding. On 401 it redirects the browser to oauth2-proxy's /oauth2/start.
    nginx.ingress.kubernetes.io/auth-url: "http://{{ include "poseidon.oauth2proxy.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "{{ include "poseidon.baseUrl" . }}/oauth2/start?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-Email,X-Auth-Request-User,X-Auth-Request-Access-Token,X-Auth-Request-Groups"
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "poseidon.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
