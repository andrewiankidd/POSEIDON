{{- if .Values.localhost.enabled }}
# ─── localhost mode: a self-contained dev playground (OFF by default) ─────────
# Alongside the normal server this stands up a second pod running the SAME image,
# configured (POSEIDON_REMOTE_URL) as a REMOTE CLIENT of the server, plus a tiny
# landing page linking both. You get a server + web-client pair to play with and
# to e2e the repoint - without the native app.
#
# The client reaches the server CROSS-ORIGIN, which only works with auth OFF (a
# browser won't send the server's auth cookie cross-site), so this is a
# single-tenant (`default` owner) playground. Use it with `auth.enabled=false`.
# Never enable in a real deployment.
{{- if .Values.auth.enabled }}
{{- fail "localhost.enabled requires auth.enabled=false - the cross-origin client can't carry the auth cookie (single-tenant playground)." }}
{{- end }}
{{- $fullname := include "poseidon.fullname" . }}
{{- $clientHost := .Values.localhost.clientHost | default (printf "client-%s" .Values.ingress.host) }}
{{- $hubHost := .Values.localhost.hubHost | default (printf "hub-%s" .Values.ingress.host) }}
{{- /* The playground is local, plain-HTTP minikube - not the cookieSecure scheme. */}}
{{- $serverUrl := printf "http://%s" .Values.ingress.host }}
{{- $clientUrl := printf "http://%s" $clientHost }}
{{- $clientName := printf "%s-client" $fullname }}
{{- $hubName := printf "%s-hub" $fullname }}
---
# The CLIENT: the same server image, but its served frontend boots as a remote
# client of the server (POSEIDON_REMOTE_URL). Its own DB is unused (emptyDir). A
# distinct name label keeps the server's Service from selecting this pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $clientName }}
  labels:
    app.kubernetes.io/name: {{ include "poseidon.name" . }}-client
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "poseidon.name" . }}-client
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "poseidon.name" . }}-client
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: client
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: client
          image: {{ include "poseidon.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            # Boot the served frontend as a REMOTE client of the server instance.
            - name: POSEIDON_REMOTE_URL
              value: {{ $serverUrl | quote }}
            - name: POSEIDON_DATA_DIR
              value: {{ .Values.persistence.mountPath | quote }}
            - name: POSEIDON_BIND_ADDR
              value: "0.0.0.0"
            - name: POSEIDON_PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: POSEIDON_NO_POLL
              value: "1"
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /api/health, port: http }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $clientName }}
  labels:
    app.kubernetes.io/name: {{ include "poseidon.name" . }}-client
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: client
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "poseidon.name" . }}-client
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- if and .Values.ingress.enabled (eq .Values.ingress.type "nginx") }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $clientName }}
  labels:
    app.kubernetes.io/name: {{ include "poseidon.name" . }}-client
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: client
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ $clientHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $clientName }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
---
# The landing page: a tiny caddy static server linking Server + Client.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $hubName }}
  labels:
    app.kubernetes.io/name: {{ include "poseidon.name" . }}-hub
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: hub
data:
  # The hub page is a card-based dev landing (server + client + connection info),
  # kept in files/hub.html so it stays maintainable; tpl renders its template
  # actions (the server/client URLs) against this release's values.
  index.html: |
{{ tpl (.Files.Get "files/hub.html") . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $hubName }}
  labels:
    app.kubernetes.io/name: {{ include "poseidon.name" . }}-hub
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "poseidon.name" . }}-hub
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "poseidon.name" . }}-hub
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: hub
    spec:
      containers:
        - name: caddy
          image: {{ .Values.localhost.caddyImage | quote }}
          args: ["caddy", "file-server", "--root", "/srv", "--listen", ":8080"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: html
              mountPath: /srv
      volumes:
        - name: html
          configMap:
            name: {{ $hubName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $hubName }}
  labels:
    app.kubernetes.io/name: {{ include "poseidon.name" . }}-hub
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: hub
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "poseidon.name" . }}-hub
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- if and .Values.ingress.enabled (eq .Values.ingress.type "nginx") }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $hubName }}
  labels:
    app.kubernetes.io/name: {{ include "poseidon.name" . }}-hub
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: hub
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ $hubHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $hubName }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
{{- end }}
