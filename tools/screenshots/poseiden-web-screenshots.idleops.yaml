# yaml-language-server: $schema=https://raw.githubusercontent.com/andrewiankidd/IdleOps/main/schema/idleops.schema.json
#
# POSEIDEN doc screenshots — WEB build (browser, not the native exe).
#
# The served web frontend IS the same bundle the Tauri window wraps, so we shoot
# the docs against a real browser instead of launching the desktop app. Target is
# the Helm `localhost` playground SERVER instance: a demo-tenant instance seeded
# with the offline `stub` provider (14 work items / 3 flagged / 3 pipelines / 3
# PRs), reachable at http://poseiden.localhost.
#
# PRECONDITION — the playground must already be up:
#     POSEIDEN_VALUES=deploy/helm/poseiden/ci/minikube-localhost-values.yaml ./poseiden.sh up
#   `up` deploys the chart (auth off => single `default` tenant), seeds the demo
#   data under `default`, and starts the ingress port-forward on 127.0.0.1:80.
#   Chromium resolves *.localhost -> 127.0.0.1, so http://poseiden.localhost then
#   loads with no hosts edit. Verify it opens in a browser before running this.
#
# Run it (input globbing is relative to the cwd, so run from THIS directory):
#     cd tools/screenshots
#     "<idleops>/src/playbk/bin/Release/<tfm>/playbk.exe" \
#       -i poseiden-web-screenshots.idleops.yaml -o . && echo done
#   (outputs are relative to this directory, so run it from here or pass -o.)
#
# One chrome-less browser window (Edge --app), navigated by clicking the sidebar
# (OCR) exactly as a user would. The long initial settle lets the async first
# paint finish before the first capture; sidebar switches are instant client-side
# routing, so a short settle suffices between screens.
#
# SCOPE — the 6 in-app screens only:
#     dashboard, work-items, pull-requests, pipelines, reports, rules
#   The 4 onboarding shots (onboarding-welcome/storage/connect/connect-filled) are
#   NOT here: the onboarding overlay only renders in a shell that can host a local
#   Service (frontend capabilities probe -> desktop/mobile native), never a plain
#   browser pointed at a server, so those stay a desktop-app capture.
steps:
  - name: Launch the playground server in a chrome-less browser window
    action: exec
    args: >
      cmd /c start "" msedge
      --app=http://poseiden.localhost/app.html
      --window-size=1440,900 --user-data-dir=%TEMP%\poseiden-shots
      --no-first-run --no-default-browser-check
    wait: false

  - name: Wait for the app window
    action: wait-window
    window: "POSEIDEN*"
    timeout: 30

  - name: Let the async first paint + demo data finish
    action: sleep
    args: "9"

  - name: Screenshot the dashboard (default screen)
    action: screenshot
    window: "POSEIDEN*"
    output: ../../docs/features/screenshots/dashboard.png

  - name: Go to Work Items
    action: click-text
    window: "POSEIDEN*"
    text: "Work Items"
  - name: Let the list render
    action: sleep
    args: "3"
  - name: Screenshot Work Items
    action: screenshot
    window: "POSEIDEN*"
    output: ../../docs/features/screenshots/work-items.png

  - name: Go to Pull Requests
    action: click-text
    window: "POSEIDEN*"
    text: "Pull Requests"
  - name: Let the list render
    action: sleep
    args: "3"
  - name: Screenshot Pull Requests
    action: screenshot
    window: "POSEIDEN*"
    output: ../../docs/features/screenshots/pull-requests.png

  - name: Go to Pipelines
    action: click-text
    window: "POSEIDEN*"
    text: "Pipelines"
  - name: Let the list render
    action: sleep
    args: "3"
  - name: Screenshot Pipelines
    action: screenshot
    window: "POSEIDEN*"
    output: ../../docs/features/screenshots/pipelines.png

  - name: Go to Reports
    action: click-text
    window: "POSEIDEN*"
    text: "Reports"
  - name: Let the report tiles render
    action: sleep
    args: "4"
  - name: Screenshot Reports
    action: screenshot
    window: "POSEIDEN*"
    output: ../../docs/features/screenshots/reports.png

  - name: Go to Rules
    action: click-text
    window: "POSEIDEN*"
    text: "Rules"
  - name: Let the rules editor render
    action: sleep
    args: "3"
  - name: Screenshot Rules
    action: screenshot
    window: "POSEIDEN*"
    output: ../../docs/features/screenshots/rules.png

  - name: Go to Recap
    action: click-text
    window: "POSEIDEN*"
    text: "Recap"
  - name: Let the deck generate + render
    action: sleep
    args: "3"
  - name: Screenshot Recap
    action: screenshot
    window: "POSEIDEN*"
    output: ../../docs/features/screenshots/recap.png

  - name: Close the browser window
    action: exec
    args: inpctl.exe --window "POSEIDEN*" --keyboard "ALT+F4"
    wait: true
