name: Dependabot auto-merge

# Auto-merges Dependabot PRs that bump a dependency by a PATCH version only.
# Minor + major bumps still come as regular PRs for human review.
#
# For `--auto` to mean "after CI passes," `main` needs branch protection with
# the CI jobs (Check + fmt (linux), Test (ubuntu/windows/macos)) marked as
# required status checks. Without that, auto-merge fires immediately. Set it at
# Settings → Branches. "Require a pull request" can stay off so direct pushes
# to main still work.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
