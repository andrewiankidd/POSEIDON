name: Release

# Desktop (Tauri installers) + CLI archives per platform, plus a best-effort
# Android APK. The Docker web image is published separately by docker.yml.
#
#   push to main    → build everything, refresh the rolling `latest-main` release
#   push to v* tag  → build everything, create a draft versioned release
#   workflow_dispatch → manual draft with the given tag
#
# Simplifications vs a full matrix (revisit as the PoC matures): single-arch per
# desktop platform (no macOS universal lipo), and iOS is left for a later pass
# since the primary mobile story is a repointed client, not a standalone build.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-platform:
    name: 🏗️ Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Stamp version + commit into every binary so the Doctor's update check
    # knows what it is. A v* tag build is that tag; a main build is the rolling
    # `latest-main`; the commit lets a moved rolling tag be detected.
    env:
      POSEIDEN_COMMIT: ${{ github.sha }}
      POSEIDEN_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.tag || 'latest-main') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows 🪟"
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            cli_bin: poseiden.exe
            bundles: "msi,nsis"
            friendly: windows
          - name: "Linux 🐧"
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            cli_bin: poseiden
            bundles: "deb,appimage"
            friendly: linux
          - name: "macOS 🍎"
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            cli_bin: poseiden
            bundles: "app,dmg"
            friendly: macos
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Install Linux deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.friendly }}

      - name: 🏷️ Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="main-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "staged=poseiden-${tag}-${{ matrix.friendly }}" >> "$GITHUB_OUTPUT"

      # ── CLI archive ──────────────────────────────────────────────────────
      - name: 🏗️ Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p poseiden-cli

      - name: 📁 Stage CLI archive
        shell: bash
        run: |
          dir="dist-cli/${{ steps.meta.outputs.staged }}"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.cli_bin }}" "$dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"

      - name: 🗜️ Pack CLI (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        working-directory: dist-cli
        run: Compress-Archive -Path "${{ steps.meta.outputs.staged }}" -DestinationPath "poseiden-cli-${{ matrix.friendly }}.zip"

      - name: 🗜️ Pack CLI (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        working-directory: dist-cli
        run: tar -czf "poseiden-cli-${{ matrix.friendly }}.tar.gz" "${{ steps.meta.outputs.staged }}"

      - name: ⬆️ Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: poseiden-cli-${{ matrix.friendly }}
          path: dist-cli/poseiden-cli-${{ matrix.friendly }}.${{ matrix.archive }}
          if-no-files-found: error

      # ── Tauri desktop installers ─────────────────────────────────────────
      - name: 📦 Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: 🏗️ Build Tauri bundle
        working-directory: crates/poseiden-app
        run: cargo tauri build --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}

      - name: 📁 Stage installers
        shell: bash
        run: |
          mkdir -p dist-desktop
          root="target/${{ matrix.target }}/release/bundle"
          find "$root" -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
            -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} dist-desktop/ \; || true
          ls -lh dist-desktop/ || true

      - name: ⬆️ Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: poseiden-desktop-${{ matrix.friendly }}
          path: dist-desktop/*
          if-no-files-found: warn

  build-android:
    name: 📱 Android 🤖 (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      POSEIDEN_COMMIT: ${{ github.sha }}
      POSEIDEN_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.tag || 'latest-main') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android
      - name: 📦 Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked
      - name: 🌱 Init + build Android APK (debug-signed)
        working-directory: crates/poseiden-app
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          cargo tauri android init
          cargo tauri android build --apk --debug
      - name: 📁 Stage APK
        run: |
          mkdir -p dist
          apk="$(find crates/poseiden-app/gen/android -type f -name '*.apk' | grep -i universal | head -n1 || true)"
          [ -z "$apk" ] && apk="$(find crates/poseiden-app/gen/android -type f -name '*.apk' | head -n1 || true)"
          if [ -n "$apk" ]; then cp "$apk" dist/poseiden-mobile-android.apk; else echo "::warning::no APK produced"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: poseiden-mobile-android
          path: dist/*
          if-no-files-found: warn

  release-tag:
    name: 🎁 Draft release (tag)
    if: |
      always() && needs.build-platform.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build-platform, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🏷️ Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: POSEIDEN ${{ steps.meta.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: dist/*

  release-rolling:
    name: 🔄 Refresh latest-main release
    if: |
      always() && needs.build-platform.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-platform, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 🧹 Delete previous latest-main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest-main --yes --cleanup-tag --repo "${{ github.repository }}" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-main
          name: "Latest main build"
          prerelease: true
          make_latest: "false"
          draft: false
          target_commitish: ${{ github.sha }}
          body: |
            Auto-built from `main` at `${{ github.sha }}`. Desktop installers +
            CLI archives per platform, plus a best-effort Android APK. For the
            web version, pull the container image from GHCR (see docker.yml).
          files: dist/*
