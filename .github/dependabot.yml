version: 2
updates:
  # Cargo workspace dependencies. Weekly; minor + patch grouped into one PR.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Don't rebase open PRs when main moves - a rebase re-runs the whole CI matrix
    # on every push, which burns Actions minutes for no benefit. Rebase manually
    # (`@dependabot rebase`) or let auto-merge update the branch when ready.
    rebase-strategy: disabled
    commit-message:
      prefix: deps
    groups:
      patches:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # GitHub Actions used in .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    commit-message:
      prefix: ci
    groups:
      patches:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # The Docker base images in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    rebase-strategy: disabled
    commit-message:
      prefix: deps
