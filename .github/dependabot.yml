version: 2
updates:
  # Cargo workspace dependencies. Weekly; minor + patch grouped into one PR.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      patches:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # GitHub Actions used in .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      patches:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # The Docker base images in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
